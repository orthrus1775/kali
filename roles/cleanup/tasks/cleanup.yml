---
- name: "Auto removing packages"
  apt: 
    autoremove: yes
  become: true
  become_method: sudo

- name: "Running clean"
  apt: 
    clean: yes
  become: true
  become_method: sudo

- name: Ensure range_admin account exists
  ansible.builtin.user:
    name: "{{ range_admin_user }}"
    comment: Range administrator
    create_home: true
    shell: /bin/zsh
    state: present
  become: true
  become_method: sudo

- name: Set range_admin password
  ansible.builtin.command:
    argv:
      - /usr/sbin/chpasswd
    stdin: "{{ range_admin_user }}:{{ range_admin_password }}"
  changed_when: true
  no_log: true
  become: true
  become_method: sudo
  
- name: Clear /tmp
  ansible.builtin.command:
    argv:
      - find
      - /tmp
      - -mindepth
      - "1"
      - -xdev
      - -depth
      - -delete
  register: tmp_clean
  failed_when: false
  changed_when: tmp_clean.rc == 0
  become: true
  become_method: sudo

- name: Check for current user's bash history
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.bash_history"
  register: user_bash_history

- name: Truncate current user's bash history
  copy:
    content: ""
    dest: "{{ ansible_facts['env']['HOME'] }}/.bash_history"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0600'
  when: user_bash_history.stat.exists

- name: Check for root bash history
  stat:
    path: /root/.bash_history
  register: root_bash_history
  become: true
  become_method: sudo

- name: Truncate root bash history
  copy:
    content: ""
    dest: /root/.bash_history
    mode: '0600'
  when: root_bash_history.stat.exists
  become: true
  become_method: sudo

- name: "Clearing root zsh history"
  file:
    path: /root/.zsh_history
    state: absent
  become: true
  become_method: sudo
  
- name: "Clearing current user's zsh history"
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.zsh_history"
    state: absent

- name: Wipe log files (keep directory structure)
  ansible.builtin.command:
    argv:
      - find
      - /var/log
      - -type
      - f
      - -exec
      - truncate
      - -s
      - "0"
      - "{}"
      - +
  become: true
  become_method: sudo
  register: log_wipe
  failed_when: false
  changed_when: true

- name: Shrink VMware disk (last seal step)
  ansible.builtin.shell: |
    set -eu
    if ! command -v vmware-toolbox-cmd >/dev/null 2>&1; then
      echo "vmware-toolbox-cmd not found" >&2
      exit 0
    fi
    dd if=/dev/zero of=/EMPTY bs=1M status=none || true
    rm -f /EMPTY
    sync
    vmware-toolbox-cmd disk shrink /
  args:
    executable: /bin/bash
  become: true
  become_method: sudo
  timeout: 7200
  register: disk_shrink
  failed_when: false
  changed_when: disk_shrink.rc == 0

- name: Ensure current user can sudo with a password
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: sudo
    append: true
  become: true
  become_method: sudo
  when: drop_nopasswd | bool

- name: Check for Packer/user NOPASSWD sudoers drop
  ansible.builtin.stat:
    path: "/etc/sudoers.d/{{ ansible_facts['user_id'] }}"
  register: user_sudoers
  become: true
  become_method: sudo
  when: drop_nopasswd | bool

- name: Require a password for the current user's sudoers drop
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ ansible_facts['user_id'] }}"
    content: "{{ ansible_facts['user_id'] }} ALL=(ALL:ALL) ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  become: true
  become_method: sudo
  when:
    - drop_nopasswd | bool
    - user_sudoers.stat.exists | default(false)

- name: Check for buildprep NOPASSWD sudoers drop
  ansible.builtin.stat:
    path: /etc/sudoers.d/buildprep
  register: buildprep_sudoers
  become: true
  become_method: sudo
  when: drop_nopasswd | bool

- name: Remove buildprep NOPASSWD sudoers drop
  ansible.builtin.file:
    path: /etc/sudoers.d/buildprep
    state: absent
  become: true
  become_method: sudo
  when:
    - drop_nopasswd | bool
    - buildprep_sudoers.stat.exists | default(false)
