---
- name: "Auto removing packages"
  apt: 
    autoremove: yes
  become: true
  become_method: sudo

- name: "Running clean"
  apt: 
    clean: yes
  become: true
  become_method: sudo

- name: Ensure range_admin account exists
  ansible.builtin.user:
    name: "{{ range_admin_user }}"
    comment: Range administrator
    create_home: true
    shell: /bin/zsh
    state: present
  become: true
  become_method: sudo

- name: Set range_admin password
  ansible.builtin.command:
    argv:
      - /usr/sbin/chpasswd
    stdin: "{{ range_admin_user }}:{{ range_admin_password }}"
  changed_when: true
  no_log: true
  become: true
  become_method: sudo
  
- name: Clear /tmp
  ansible.builtin.command:
    argv:
      - find
      - /tmp
      - -mindepth
      - "1"
      - -xdev
      - -depth
      - -delete
  register: tmp_clean
  failed_when: false
  changed_when: tmp_clean.rc == 0
  become: true
  become_method: sudo

- name: Check for target user's bash history
  stat:
    path: "{{ c2_home }}/.bash_history"
  register: user_bash_history

- name: Truncate target user's bash history
  copy:
    content: ""
    dest: "{{ c2_home }}/.bash_history"
    owner: "{{ c2_user }}"
    group: "{{ c2_user }}"
    mode: '0600'
  when: user_bash_history.stat.exists

- name: Check for root bash history
  stat:
    path: /root/.bash_history
  register: root_bash_history
  become: true
  become_method: sudo

- name: Truncate root bash history
  copy:
    content: ""
    dest: /root/.bash_history
    mode: '0600'
  when: root_bash_history.stat.exists
  become: true
  become_method: sudo

- name: "Clearing root zsh history"
  file:
    path: /root/.zsh_history
    state: absent
  become: true
  become_method: sudo
  
- name: "Clearing target user's zsh history"
  file:
    path: "{{ c2_home }}/.zsh_history"
    state: absent

- name: Wipe log files (keep directory structure)
  ansible.builtin.command:
    argv:
      - find
      - /var/log
      - -type
      - f
      - -exec
      - truncate
      - -s
      - "0"
      - "{}"
      - +
  become: true
  become_method: sudo
  register: log_wipe
  failed_when: false
  changed_when: true

#- name: "Deleting buildprep in sudoers.d"
#  file:
#    path: /etc/sudoers.d/buildprep
#    state: absent
#  become: true
