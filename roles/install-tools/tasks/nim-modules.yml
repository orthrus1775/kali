- name: "Creating Nim modules directory"
  ansible.builtin.file:
    path: "/opt/nimmods"
    state: directory
    mode: '0755'

- name: "Installing useful github repos"
  git:
    repo: "{{ item.repo }}"
    dest: "{{ item.location }}"
    force: true 
  loop:
    - { repo: "https://github.com/Sn1r/Nim-Reverse-Shell.git", location: "/opt/nimmods/nim-rev-shell" }  
    - { repo: "https://github.com/byt3bl33d3r/OffensiveNim.git", location: "/opt/nimmods/offensivenim" }
    - { repo: "https://github.com/icyguider/Nimcrypt2.git", location: "/opt/nimmods/nimcrypt2" }
    - { repo: "https://github.com/miere43/nim-registry.git", location: "/opt/nimmods/nim-registry"}
    - { repo: "https://github.com/D3Ext/Nimbus.git", location: "/opt/nimmods/nimbus" }
    - { repo: "https://github.com/itaymigdal/PartyLoader.git", location: "/opt/nimmods/partyloader" }

- name: "Installing packages with Nimble"
  shell: "nimble install winim nimcrypto docopt psutil nimprotect supersnappy argparse ptr_math strenc libp2p ws zippy iputils socks5 daemon tiny_sqlite dnsclient -y"