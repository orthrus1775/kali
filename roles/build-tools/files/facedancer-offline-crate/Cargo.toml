[package]
name = "facedancer_offline_deps"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

# Must match FaceDancer build/src/build.rs maincargo() payload deps
[dependencies]
windows = { version = "0.52.0", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security", "Win32_System_SystemServices"] }
winapi = { version = "0.3.9", features = ["memoryapi", "libloaderapi", "winuser"] }
ntapi = "0.4.0"
pelite = "0.9.1"
winproc = "0.6.4"
winreg = "*"
sha2 = "0.10.6"
