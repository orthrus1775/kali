---
- name: "Setup Certipy virtual environment"
  ansible.builtin.shell:
    cmd: |
      python3 -m venv .certipy-venv
      source .certipy-venv/bin/activate
      pip install .
      deactivate
    chdir: /opt/Certipy
    executable: /bin/bash
  become: true
  become_method: sudo

- name: "Setup Beatrice virtual environment"
  ansible.builtin.shell:
    cmd: |
      python3 -m venv .venv
      source .venv/bin/activate
      pip install -r requirements.txt
      deactivate
    chdir: /opt/beatrice
    executable: /bin/bash
  become: true
  become_method: sudo

- name: "Setup bofhound virtual environment"
  ansible.builtin.shell:
    cmd: |
      python3 -m venv .bofhound
      source .bofhound/bin/activate
      pip install .
      deactivate
    chdir: /opt/BOFs/bofhound
    executable: /bin/bash
  become: true
  become_method: sudo  

- name: "Setup pywhisker virtual environment"
  ansible.builtin.shell:
    cmd: |
      python3 -m venv .venv
