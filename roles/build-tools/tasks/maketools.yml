- name: "Compile Chisel"
  ansible.builtin.shell:
    cmd: |
      make dep
      make linux
      make windows
    chdir: /opt/chisel
    executable: /bin/bash
  become: true
  become_method: sudo

- name: "Compile go-cookie-monster"
  ansible.builtin.shell:
    cmd: |
      make all
    chdir: /opt/go-cookie-monster
    executable: /bin/bash
  become: true
  become_method: sudo

- name: "Make Rusthound Linux"
  ansible.builtin.shell:
    cmd: "export PATH=$HOME/.cargo/bin:$PATH && make release"
    chdir: /opt/rusthound
  register: rusthound_linux
  retries: 3
  delay: 10
  until: rusthound_linux.rc == 0
  ignore_errors: true

- name: "Make Rusthound Windows"
  ansible.builtin.shell:
    cmd: "export PATH=$HOME/.cargo/bin:$PATH && make windows"
    chdir: /opt/rusthound
  register: rusthound_windows
  retries: 3
  delay: 10
  until: rusthound_windows.rc == 0
  ignore_errors: true

- name: "Make Hooka"
  ansible.builtin.shell:
    cmd: make all
    chdir: /opt/Hooka
  register: hooka_build
  retries: 3
  delay: 10
  until: hooka_build.rc == 0
  ignore_errors: true

- name: "Make RegPwn"
  ansible.builtin.shell:
    cmd: |
      make all
      make test
    chdir: /opt/BOFs/RegPwnBOF
  register: regpwn_build
  retries: 3
  delay: 10
  until: regpwn_build.rc == 0
  ignore_errors: true  
