- name: "Compile Chisel"
  ansible.builtin.shell:
    cmd: |
      make dep
      make linux
      make windows
    chdir: /opt/chisel
    executable: /bin/bash
  become: true
  become_method: sudo

- name: "Compile go-cookie-monster"
  ansible.builtin.shell:
    cmd: |
      make all
    chdir: /opt/go-cookie-monster
    executable: /bin/bash
  become: true
  become_method: sudo

- name: "Make Rusthound Linux"
  ansible.builtin.shell:
    cmd: "export PATH=$HOME/.cargo/bin:$PATH && make release"
    chdir: /opt/rusthound
  ignore_errors: true  

- name: "Make Rusthound Windows"
  ansible.builtin.shell:
    cmd: "export PATH=$HOME/.cargo/bin:$PATH && make windows"
    chdir: /opt/rusthound
  ignore_errors: true 
