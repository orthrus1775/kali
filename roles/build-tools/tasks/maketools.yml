---
- name: "Setup {{ item.name }} virtual environment"
  ansible.builtin.pip:
    name: "{{ item.pip_name | default(omit) }}"
    requirements: "{{ (item.chdir ~ '/' ~ item.requirements) if item.requirements is defined else omit }}"
    chdir: "{{ item.chdir }}"
    virtualenv: "{{ item.chdir }}/{{ item.venv }}"
    virtualenv_command: python3 -m venv
  loop: "{{ python_venvs }}"
  become: true
  become_method: sudo

- name: "Compile {{ item.name }}"
  ansible.builtin.shell:
    cmd: "{{ item.cmd | join('\n') }}"
    chdir: "{{ item.chdir }}"
    executable: /bin/bash
  loop: "{{ compile_strict }}"
  become: true
  become_method: sudo

- name: "Compile {{ item.name }} (retry)"
  ansible.builtin.shell:
    cmd: "{{ ('export PATH=' ~ item.path_prepend ~ ':$PATH\n') if item.path_prepend is defined else '' }}{{ item.cmd | join('\n') }}"
    chdir: "{{ item.chdir }}"
    executable: /bin/bash
  loop: "{{ compile_retry }}"
  register: compile_retry_result
  retries: 3
  delay: 10
  until: compile_retry_result.rc == 0
  ignore_errors: true

- name: "Create /opt/scripts directory"
  ansible.builtin.file:
    path: /opt/scripts/
    state: directory
    mode: '0755'
  become: true
  become_method: sudo

- name: "Copy coverfiles to /opt"
  ansible.builtin.copy:
    src: files/coverfiles/
    dest: /opt/coverfiles/
    mode: preserve
  become: true
  become_method: sudo

- name: "Deploy operator scripts to /opt/scripts"
  ansible.builtin.copy:
    src: "files/{{ item }}"
    dest: "/opt/scripts/{{ item }}"
    mode: "0755"
  loop:
    - deploy-keys.sh
    - config-ssh.sh
    - config-infrax.sh
    - create-tunnel.sh
    - check-tunnel.sh
  become: true
  become_method: sudo
