---
- name: Create reg_export source directory in cs-remote-ops
  ansible.builtin.file:
    path: /opt/BOFs/cs-remote-ops/src/Remote/reg_export
    state: directory
    mode: '0755'
  become: true
  become_method: sudo

- name: Deploy reg_export BOF source files
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: "files/reg_export bof/reg_export.c", dest: "/opt/BOFs/cs-remote-ops/src/Remote/reg_export/entry.c" }
    - { src: "files/reg_export bof/Makefile",     dest: "/opt/BOFs/cs-remote-ops/src/Remote/reg_export/Makefile" }
  become: true
  become_method: sudo

- name: Find Makefiles in /opt/BOFs (excluding cs-remote-ops and cs-sa)
  find:
    paths: /opt/BOFs
    patterns: "Makefile"
    recurse: yes
    excludes: []
  register: bof_makefiles

- name: Filter out cs-remote-ops and cs-sa Makefiles
  set_fact:
    filtered_makefiles: "{{ bof_makefiles.files | map(attribute='path') | reject('match', '.*(cs-remote-ops|cs-sa).*') | list }}"

- name: Build BOFs via Makefile
  ansible.builtin.shell:
    cmd: make
    chdir: "{{ item | dirname }}"
  loop: "{{ filtered_makefiles }}"
  loop_control:
    label: "{{ item | dirname }}"
  ignore_errors: true

- name: Run make_all.sh for cs-remote-ops
  ansible.builtin.shell:
    cmd: bash make_all.sh
    chdir: /opt/BOFs/cs-remote-ops

- name: Run make_all.sh for cs-sa
  ansible.builtin.shell:
    cmd: bash make_all.sh
    chdir: /opt/BOFs/cs-sa
