- name: "Build Bloodhound-CE"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      docker compose up -d
      for i in $(seq 1 60); do
        if docker compose logs 2>/dev/null | grep -q "Initial Password Set To:"; then
          break
        fi
        if [ "$i" -eq 60 ]; then
          echo "Timed out waiting for BloodHound initial password" >&2
          exit 1
        fi
        sleep 2
      done
      docker compose logs 2>/dev/null \
        | grep "Initial Password Set To:" \
        | tail -1 \
        | sed 's/.*Initial Password Set To:[[:space:]]*//' \
        | sed 's/[[:space:]]*#[[:space:]]*$//' \
        > /opt/bloodhound/BH_PASS.txt
      chmod 600 /opt/bloodhound/BH_PASS.txt
    chdir: /opt/bloodhound/
    executable: /bin/bash
  become: true
  become_method: sudo 

- name: Stop all running Docker containers
  ansible.builtin.shell: |
    running_containers="$(docker ps -q 2>/dev/null || true)"
    if [[ -n "$running_containers" ]]; then
      docker stop $running_containers
    fi
  args:
    executable: /bin/bash
  become: true
  become_method: sudo  

- name: Install BloodHound systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/bloodhound.service
    mode: "0644"
    content: |
      [Unit]
      Description=BloodHound CE (docker compose)
      After=docker.service network-online.target
      Requires=docker.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/bloodhound
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=300
      [Install]
      WantedBy=multi-user.target
      
- name: Enable and start BloodHound
  ansible.builtin.systemd:
    name: bloodhound
    daemon_reload: true
    enabled: true
    state: started
  become: true
  become_method: sudo