---
- name: Create a BloodhoundCE directory
  ansible.builtin.file:
    path: /opt/bloodhound
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: 0755

- name: Copy Compose file
  ansible.builtin.copy:
    src: /opt/bloodhound/examples/docker-compose/docker-compose.yml
    dest: /opt/bloodhound/docker-compose.yml
  become: true
  become_method: sudo

- name: Copy Compose override for default admin env
  ansible.builtin.copy:
    src: bloodhound.compose.override.yml
    dest: /opt/bloodhound/docker-compose.override.yml
    mode: '0644'
  become: true
  become_method: sudo

- name: Write BloodHound .env
  ansible.builtin.template:
    src: bloodhound.env.j2
    dest: /opt/bloodhound/.env
    mode: '0600'
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
  become: true
  become_method: sudo

- name: Write BloodHound password file
  ansible.builtin.copy:
    dest: /opt/bloodhound/BH_PASS.txt
    content: "{{ bloodhound_admin_password }}\n"
    mode: '0600'
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
  become: true
  become_method: sudo

- name: Start Bloodhound-CE
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/bloodhound
  become: true
  become_method: sudo

- name: Wait for BloodHound UI
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/ui/login
    status_code:
      - 200
      - 301
      - 302
    timeout: 10
  register: bloodhound_ui
  retries: 30
  delay: 4
  until: bloodhound_ui is succeeded 

- name: Stop all running Docker containers
  ansible.builtin.shell: |
    running_containers="$(docker ps -q 2>/dev/null || true)"
    if [[ -n "$running_containers" ]]; then
      docker stop $running_containers
    fi
  args:
    executable: /bin/bash
  become: true
  become_method: sudo  

- name: Install BloodHound systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/bloodhound.service
    mode: "0644"
    content: |
      [Unit]
      Description=BloodHound CE (docker compose)
      After=docker.service network-online.target
      Requires=docker.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/bloodhound
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=300
      [Install]
      WantedBy=multi-user.target
  become: true
  become_method: sudo    

- name: Enable and start BloodHound
  ansible.builtin.systemd:
    name: bloodhound
    daemon_reload: true
    enabled: true
    state: started
  become: true
  become_method: sudo