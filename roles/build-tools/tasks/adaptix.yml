- name: "Fix Kharon Post-Ex"
  ansible.builtin.shell:
    cmd: |
      sed -i 's|let bof_path   = ax\.script_dir() + "bofs/lateralmov/scm_create_service\." + ax\.arch(id) + "\.o";|let bof_path   = ax.script_dir() + "bofs/dist/scm_create_service." + ax.arch(id) + ".o";|' /opt/PostEx-Arsenal/kh_modules.axs
  become: true
  become_method: sudo

- name: "Deploy AXS extension scripts"
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: "files/AXS Scripts/TrustedSec-Remote-Ops.axs",      dest: "/opt/BOFs/cs-remote-ops/Remote/TrustedSec-Remote-Ops.axs" }
    - { src: "files/AXS Scripts/TrustedSec-Remote-Injection.axs", dest: "/opt/BOFs/cs-remote-ops/Injection/TrustedSec-Remote-Injection.axs" }
    - { src: "files/AXS Scripts/TrustedSec-SA-BOFs.axs",         dest: "/opt/BOFs/cs-sa/SA/TrustedSec-SA-BOFs.axs" }
    - { src: "files/AXS Scripts/persistask.axs",                  dest: "/opt/BOFs/persistask/persistask.axs" }
  become: true
  become_method: sudo

